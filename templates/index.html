{% extends 'base.html' %}
{% block content %}
<main>

        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                <h1>{{ name }}</h1>
            </div>
            <div class="hero-photo">
                <div class="photo-block"></div>
                <img class="avatar" src="/static/img/khansa.jpeg" alt="Photo of {{ name }}">
            </div>
            <div class="hero-details">
                <p class="bio">Undergraduate Information Systems student, passionate in business and creating impact.</p>
                <dl class="meta-list">
                    <div class="meta-row">

                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>S1 Sistem Informasi</dd>

                </dl>
                <div class="social-links">
                    <a href="https://github.com/khansakkh" class="social-link">GitHub</a>
                    <a href="https://www.linkedin.com/in/khansakkh/" class="sociallink">LinkedIn</a>
                    <a href="mailto:khansaahaikal@gmail.com" class="sociallink">Email</a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
